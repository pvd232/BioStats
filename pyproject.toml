[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mantra-provenance"
version = "0.1.0"
description = "Artifact provenance models for MANTRA"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
include = ["mantra_provenance*"]

