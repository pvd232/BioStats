[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mantra-provenance"
version = "0.1.0"
description = "Artifact provenance models for MANTRA"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=1,<2",
    "numpy>=2,<3",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
    "torch>=2.6,<3",
    "torchdata==0.11.0",
]

[project.optional-dependencies]
test = [
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.ruff]
exclude = ["mantra_provenance/archive"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


[tool.setuptools.packages.find]
include = ["mantra_provenance*"]
