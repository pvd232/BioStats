name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - name: Install project and validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,release]"
      - name: Lint and type-check
        run: ruff check viper tests examples/project/src tools && pyright
      - name: Run tests
        run: python -m pytest tests -q
      - name: Build and inspect distributions
        run: python -m build && python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "from viper.protocol import RunSpec; print(RunSpec.__name__)"
