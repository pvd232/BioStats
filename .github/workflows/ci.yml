name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - name: Install project and validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,release]"
      - name: Lint and type-check
        run: ruff check viper tests examples/project/src tools && pyright
      - name: Run tests
        run: python -m pytest tests -q
      - name: Build and inspect distributions
        run: python -m build && python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "import viper; assert all(getattr(viper, name) for name in viper.__all__)"
          python -I -c "import importlib; modules = ('application', 'authoring', 'ids', 'inspection', 'journal', 'local_store', 'materialization', 'metrics', 'preflight', 'protocol', 'resume', 'runner', 'runtime', 'serialization', 'stage_execution', 'stage_worker', 'verifier', 'worker', 'workspace'); assert all(importlib.import_module(f'viper.{name}') for name in modules)"
          python -I -c "from viper import application; assert all(getattr(application, name) for name in application.__all__)"
          python -I -c "from viper.application import CapabilitiesRequest, get_capabilities; assert 'run_local' in get_capabilities(CapabilitiesRequest()).operations"
          viper --json capabilities
          viper status --help
          viper compare-runs --help
