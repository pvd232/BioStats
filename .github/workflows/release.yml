name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify the signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_OBJECT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq '.verification.verified')" = "true"
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python -m build
          python -m twine check dist/*
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/viper-provenance
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Download candidate distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Verify TestPyPI files and installed package
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          for ATTEMPT in {1..12}; do
            if python tools/verify_package_index.py \
              --index https://test.pypi.org \
              --project viper-provenance \
              --version "$VERSION" \
              --dist dist; then
              break
            fi
            test "$ATTEMPT" -lt 12
            sleep 10
          done
          python -m pip install dist/*.whl
          python -m pip uninstall --yes viper-provenance
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --no-deps \
            "viper-provenance==$VERSION"
          python -I -c "from importlib import resources; import viper; assert resources.files(viper).joinpath('py.typed').is_file(); assert all(getattr(viper, name) for name in viper.__all__)"
          viper --json capabilities
          ACCEPTANCE_ROOT="$(mktemp -d)"
          cp -R tests examples pyproject.toml "$ACCEPTANCE_ROOT/"
          cd "$ACCEPTANCE_ROOT"
          python -m pytest tests/test_generated_project_acceptance.py -q

  publish-pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/viper-provenance
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
